server:
  port: 8080

spring:
  application:
    name: ai-library-server
  # 本地密钥文件（gitignore，不存在时跳过；环境变量 AI_API_KEY 优先）
  config:
    import: optional:application-secret.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai-library?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# PageHelper 分页
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT 配置（生产环境请通过环境变量覆盖密钥）
jwt:
  secret: "ai-library-jwt-secret-key-please-change-in-production-0123456789"
  # token 有效期 24h
  expire-millis: 86400000

# AI（LLM）配置：智谱 GLM-4-Flash，OpenAI 兼容接口
ai:
  base-url: https://open.bigmodel.cn/api/paas/v4
  api-key: ${AI_API_KEY:your-api-key}
  model: glm-4-flash
  timeout: 60000
  max-history: 10
  max-context-books: 20

# 上传文件保存目录（自动映射为静态资源 /upload/**）
app:
  upload-dir: upload

# 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true

logging:
  level:
    com.library: debug
